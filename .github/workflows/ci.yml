name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dart-lang/setup-dart@v1
        with:
          # scip-dart 1.8.1을 시험한 SDK예요. 올릴 때는 scip-dart와 함께 올려요.
          sdk: 3.13.7
      - name: scip-dart 설치
        run: dart pub global activate scip_dart 1.8.1
      - run: npm ci
      - run: npm run check
